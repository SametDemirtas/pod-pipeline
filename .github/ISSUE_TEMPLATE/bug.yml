name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: >-
        On macOS, POD Pipeline > About POD Pipeline. Otherwise the version in the name of the
        installer you used, such as 0.1.0 in POD Pipeline-0.1.0-win-x64.exe.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        The relevant lines of the app's log, if any. Leave out API keys, tokens and shop details.
      render: text
